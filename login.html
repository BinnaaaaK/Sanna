<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANNA | Login & Sign Up</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcfcfc;
            padding: 20px;
        }
        .auth-box {
            background: #ffffff;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: #666;
            font-size: 0.9rem;
        }

        /* 소셜 로그인 버튼 그룹 */
        .social-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .social-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            border: none;
            transition: 0.2s;
        }
        
        /* 카카오 스타일 */
        .btn-kakao {
            background-color: #FEE500;
            color: #191919;
        }
        .btn-kakao:hover { background-color: #fada0A; }

        /* 네이버 스타일 */
        .btn-naver {
            background-color: #03C75A;
            color: #ffffff;
        }
        .btn-naver:hover { background-color: #02b351; }

        /* 구글 스타일 */
        .btn-google {
            background-color: #ffffff;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-google:hover { background-color: #f9f9f9; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }
        .divider span { padding: 0 10px; }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #333;
        }
        .form-group input[type="text"], .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #1a1a1a;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 0.88rem;
            color: #444;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover { background: #333; }
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
        }
        .toggle-auth a {
            color: #1a1a1a;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2 id="form-title">SANNA 로그인</h2>
                <p id="form-sub">기록으로 시작하는 소중한 아카이브 커뮤니티</p>
            </div>

            <!-- 소셜 간편 로그인 영역 -->
            <div class="social-btn-group">
                <!-- 카카오 로그인 버튼 -->
                <button class="social-btn btn-kakao" onclick="handleSocialAuth('카카오')">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#191919" d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.707 4.8 4.27 6.09-.188.702-.682 2.545-.78 2.94-.122.49.178.483.376.352.157-.103 2.5-1.7 3.513-2.393.535.078 1.08.118 1.621.118 4.97 0 9-3.186 9-7.115S16.97 3 12 3z"/></svg>
                    카카오로 시작하기
                </button>

                <!-- 네이버 로그인 버튼 -->
                <button class="social-btn btn-naver" onclick="handleSocialAuth('네이버')">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#ffffff" d="M16.273 12.845L7.376 0H0v24h7.726v-12.845L16.624 24H24V0h-7.727z"/></svg>
                    네이버로 시작하기
                </button>

                <!-- Google 로그인 버튼 -->
                <button class="social-btn btn-google" onclick="handleSocialAuth('Google')">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Google 계정으로 로그인
                </button>
            </div>

            <div class="divider"><span>또는 일반 로그인</span></div>

            <form id="auth-form" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="username" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>

                <!-- 회원가입 전용 옵션 (산나 회원 여부 체크) -->
                <div id="signup-options" style="display: none;">
                    <label class="checkbox-group">
                        <input type="checkbox" id="is-sanna-member">
                        <span>산나 회원입니다 (아이디 뒤에 <strong>_sanna</strong> 자동 부여)</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn-text">로그인</button>
            </form>

            <div class="toggle-auth">
                <span id="toggle-text">계정이 없으신가요?</span>
                <a onclick="toggleAuthMode()" id="toggle-link">회원가입하기</a>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="font-size: 0.8rem; color: #888;">← 메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script>
        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('form-title');
            const sub = document.getElementById('form-sub');
            const signupOptions = document.getElementById('signup-options');
            const submitBtn = document.getElementById('submit-btn-text');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');

            if (isSignUpMode) {
                title.innerText = "SANNA 회원가입";
                sub.innerText = "산나 아카이브에 오신 것을 환영합니다.";
                signupOptions.style.display = "block";
                submitBtn.innerText = "회원가입하기";
                toggleText.innerText = "이미 계정이 있으신가요?";
                toggleLink.innerText = "로그인하기";
            } else {
                title.innerText = "SANNA 로그인";
                sub.innerText = "기록으로 시작하는 소중한 아카이브 커뮤니티";
                signupOptions.style.display = "none";
                submitBtn.innerText = "로그인";
                toggleText.innerText = "계정이 없으신가요?";
                toggleLink.innerText = "회원가입하기";
            }
        }

        // 일반 ID/PW 로그인 제출
        function handleSubmit(e) {
            e.preventDefault();
            let rawUsername = document.getElementById('username').value.trim();
            const isSannaMember = document.getElementById('is-sanna-member').checked;

            if (!rawUsername) return;

            let finalUsername = rawUsername;

            if (isSignUpMode) {
                if (isSannaMember && !rawUsername.endsWith('_sanna')) {
                    finalUsername = rawUsername + '_sanna';
                }

                const userData = {
                    username: finalUsername,
                    isSanna: finalUsername.endsWith('_sanna')
                };
                localStorage.setItem('sanna_user_' + finalUsername, JSON.stringify(userData));
                localStorage.setItem('sanna_current_user', JSON.stringify(userData));

                alert(`회원가입이 완료되었습니다!\n생성된 아이디: ${finalUsername}`);
            } else {
                const isSanna = finalUsername.endsWith('_sanna');
                const userData = {
                    username: finalUsername,
                    isSanna: isSanna
                };
                localStorage.setItem('sanna_current_user', JSON.stringify(userData));
                alert(`${finalUsername}님, 환영합니다!`);
            }

            window.location.href = 'index.html';
        }

        // 소셜 로그인 (카카오 / 네이버 / 구글) 연동
        function handleSocialAuth(provider) {
            // 산나 회원 여부 묻기
            const isSanna = confirm(`[${provider} 연동 로그인]\n\n산나 정회원이신가요?\n\n- '확인' 클릭: 산나 정회원 계정 생성 (_sanna 부여)\n- '취소' 클릭: 일반 방문자 계정 생성`);

            const prefix = provider === '카카오' ? 'kakao' : provider === '네이버' ? 'naver' : 'google';
            const username = isSanna ? `${prefix}_user_sanna` : `${prefix}_user`;

            const userData = {
                username: username,
                isSanna: isSanna
            };

            // 로그인 상태 저장
            localStorage.setItem('sanna_current_user', JSON.stringify(userData));
            
            alert(`${provider} 계정으로 로그인되었습니다.\n(발급된 아이디: ${username})`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
