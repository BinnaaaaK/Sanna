
<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>SANNA | 로그인 · 회원가입</title>

  <!-- 공통 스타일 -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Pretendard 폰트 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <style>

    /* ==========================================
       1. 로그인 페이지 기본 레이아웃
       ========================================== */

    body {
      background: #fcfcfc;
    }

    .auth-layout {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .auth-panel {
      background: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 18px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.03);
    }


    /* ==========================================
       2. 제목 및 안내문
       ========================================== */

    .auth-heading {
      text-align: center;
      margin-bottom: 26px;
    }

    .auth-heading h1 {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .auth-heading p {
      font-size: 14px;
      color: #777;
      margin-top: 8px;
    }


    /* ==========================================
       3. 로그인 / 회원가입 탭
       ========================================== */

    .auth-tabs {
      display: flex;
      background: #f4f4f4;
      border-radius: 10px;
      padding: 5px;
      gap: 5px;
      margin-bottom: 24px;
    }

    .auth-tabs button {
      width: 50%;
      padding: 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #777;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .auth-tabs button.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0,0,0,0.06);
    }


    /* ==========================================
       4. 입력 폼
       ========================================== */

    .field {
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      font-weight: 750;
      display: block;
      margin-bottom: 7px;
    }

    .field input[type="email"],
    .field input[type="password"],
    .field input[type="text"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 13px 12px;
      font-size: 15px;
      background: #ffffff;
    }

    .field input:focus {
      border-color: #111;
      outline: none;
    }


    /* ==========================================
       5. 메인 버튼
       ========================================== */

    .auth-submit {
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: #1a1a1a;
      color: #ffffff;
      padding: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .auth-submit:hover {
      background: #333;
    }

    .auth-submit:disabled,
    .social-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }


    /* ==========================================
       6. 구분선
       ========================================== */

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #aaa;
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      height: 1px;
      background: #eee;
      flex: 1;
    }


    /* ==========================================
       7. 간편로그인 버튼
       ========================================== */

    .social-stack {
      display: grid;
      gap: 9px;
    }

    .social-btn {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 13px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      background: #ffffff;
      transition: opacity 0.2s;
    }

    .social-btn:hover {
      opacity: 0.85;
    }

    /* 카카오 */
    .social-btn.kakao {
      background: #fee500;
      border-color: #fee500;
      color: #191919;
    }

    /* 네이버 */
    .social-btn.naver {
      background: #03c75a;
      border-color: #03c75a;
      color: #ffffff;
    }


    /* ==========================================
       8. 안내 및 오류 메시지
       ========================================== */

    .feedback {
      display: none;
      margin: 17px 0 0;
      padding: 13px 14px;
      font-size: 13px;
      line-height: 1.6;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .feedback.show {
      display: block;
    }

    .feedback.error {
      background: #fff1ef;
      color: #9b2020;
    }

    .feedback.ok {
      background: #ecf8ef;
      color: #176934;
    }

    .feedback.info {
      background: #f1f3f5;
      color: #475467;
    }

    .signup-note {
      font-size: 12px;
      color: #777;
      line-height: 1.6;
      margin: 12px 0;
    }


    /* ==========================================
       9. 회원 유형 선택
       ========================================== */

    .radio-box {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 12px;
      margin: 9px 0;

      display: flex;
      align-items: flex-start;
      gap: 10px;

      cursor: pointer;
      transition: border-color 0.2s;
    }

    .radio-box:hover {
      border-color: #999;
    }

    .radio-box:has(input:checked) {
      border-color: #1a1a1a;
      background: #f9f9f9;
    }

    .radio-box input {
      margin-top: 4px;
      accent-color: #1a1a1a;
    }

    .radio-box strong {
      font-size: 14px;
      font-weight: 800;
    }

    .radio-box span {
      display: block;
      color: #888;
      font-size: 12px;
      margin-top: 3px;
    }


    /* ==========================================
       10. 개인정보 동의
       ========================================== */

    .terms {
      font-size: 12px;
      line-height: 1.65;
      color: #555;

      display: flex;
      align-items: flex-start;
      gap: 8px;

      margin-top: 18px;
    }

    .terms input {
      margin-top: 4px;
      flex-shrink: 0;
      accent-color: #1a1a1a;
    }

    .terms a {
      text-decoration: underline;
    }


    /* ==========================================
       11. 보조 버튼
       ========================================== */

    .secondary-btn {
      border: 0;
      background: none;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      display: block;
      margin: 16px auto 0;
      padding: 4px;
    }

    .secondary-btn:hover {
      color: #111;
    }

    .back {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #777;
    }

    .back a:hover {
      color: #111;
    }


    /* ==========================================
       12. 화면 표시 제어
       ========================================== */

    .hidden {
      display: none !important;
    }


    /* ==========================================
       13. 모바일 반응형
       ========================================== */

    @media (max-width: 480px) {
      .auth-panel {
        padding: 28px 22px;
      }

      .auth-heading h1 {
        font-size: 24px;
      }

      .social-btn {
        font-size: 13px;
      }

      .auth-tabs button {
        font-size: 13px;
      }
    }

  </style>
</head>


<body>

  <main class="auth-layout">

    <section class="auth-panel">

      <!-- ======================================
           로그인 페이지 제목
           ====================================== -->

      <div class="auth-heading">

        <h1 id="heading">
          SANNA 로그인
        </h1>

        <p id="subheading">
          기록을 함께하는 산나 커뮤니티
        </p>

      </div>


      <!-- ======================================
           1. 로그인 / 회원가입 선택 영역
           ====================================== -->

      <div id="auth-area">

        <div class="auth-tabs">

          <button
            type="button"
            id="tab-login"
            class="active">
            로그인
          </button>

          <button
            type="button"
            id="tab-register">
            회원가입
          </button>

        </div>


        <!-- ====================================
             일반 이메일 로그인 / 회원가입
             ==================================== -->

        <form id="email-form" novalidate>

          <div class="field">

            <label for="email">
              이메일
            </label>

            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              placeholder="example@email.com"
            />

          </div>


          <div class="field">

            <label for="password">
              비밀번호
            </label>

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              minlength="8"
              required
              placeholder="8자 이상"
            />

          </div>


          <!-- 회원가입 모드에서만 표시 -->

          <div class="field hidden" id="confirm-wrap">

            <label for="confirm">
              비밀번호 확인
            </label>

            <input
              type="password"
              id="confirm"
              name="confirm"
              autocomplete="new-password"
              minlength="8"
              placeholder="비밀번호를 다시 입력하세요"
            />

          </div>


          <button
            class="auth-submit"
            type="submit"
            id="email-submit">
            로그인
          </button>

        </form>


        <!-- 비밀번호 재설정 -->

        <button
          type="button"
          class="secondary-btn"
          id="reset-password">
          비밀번호를 잊으셨나요?
        </button>


        <!-- 이메일 가입 안내 -->

        <p class="signup-note hidden" id="signup-note">

          이메일 인증 후 로그인하면
          SANNA 회원정보 입력 화면이 표시됩니다.

          가입을 완료해야 서비스에 접근할 수 있습니다.

        </p>


        <!-- ====================================
             간편로그인 영역
             ==================================== -->

        <div class="auth-divider">
          또는 간편 계정으로 시작하기
        </div>


        <div class="social-stack">

          <!-- 카카오 -->

          <button
            type="button"
            class="social-btn kakao"
            data-provider="kakao">
            카카오로 시작하기
          </button>


          <!-- 네이버 -->

          <button
            type="button"
            class="social-btn naver"
            data-provider="custom:naver">
            네이버로 시작하기
          </button>


          <!-- Google -->

          <button
            type="button"
            class="social-btn"
            data-provider="google">
            Google 계정으로 시작하기
          </button>

        </div>


        <p class="signup-note">

          처음 인증한 소셜 계정은 반드시
          SANNA 회원가입을 완료해야 합니다.

          기존 가입자는 바로 로그인됩니다.

        </p>

      </div>


      <!-- ======================================
           2. SANNA 신규 회원정보 입력
           ====================================== -->

      <form id="onboarding" class="hidden" novalidate>

        <p class="signup-note">

          계정 인증이 완료되었습니다.

          아래 SANNA 회원정보를 제출해야
          가입이 완료됩니다.

        </p>


        <!-- 이름 -->

        <div class="field">

          <label for="display-name">
            이름 (관리자 확인용)
          </label>

          <input
            id="display-name"
            name="display-name"
            type="text"
            minlength="2"
            maxlength="30"
            autocomplete="name"
            placeholder="이름을 입력하세요"
            required
          />

        </div>


        <!-- 회원 유형 선택 -->

        <div
          class="field"
          style="font-weight:750;font-size:13px;">

          가입 유형

        </div>


        <!-- 일반 회원 -->

        <label class="radio-box">

          <input
            type="radio"
            name="join-type"
            value="guest"
            checked
          />

          <div>

            <strong>일반 회원</strong>

            <span>
              공개 콘텐츠 이용
            </span>

          </div>

        </label>


        <!-- 정회원 신청 -->

        <label class="radio-box">

          <input
            type="radio"
            name="join-type"
            value="sanna"
          />

          <div>

            <strong>산나 정회원 신청</strong>

            <span>
              관리자 승인 후 정기 공지 이용 가능
            </span>

          </div>

        </label>


        <!-- 산나 활동명 -->

        <div class="field">

          <label for="member-alias">
            산나에서 사용하는 이름 (선택)
          </label>

          <input
            id="member-alias"
            name="member-alias"
            type="text"
            maxlength="40"
            placeholder="관리자가 알아보는 활동명"
          />

        </div>


        <!-- 본인 확인 참고사항 -->

        <div class="field">

          <label for="reference-note">
            본인 확인 참고사항 (선택)
          </label>

          <input
            id="reference-note"
            name="reference-note"
            type="text"
            maxlength="160"
            placeholder="예: 함께 활동한 모임 또는 소개자 이름"
          />

        </div>


        <!-- 개인정보 수집 동의 -->

        <label class="terms">

          <input
            type="checkbox"
            id="data-consent"
            required
          />

          <span>

            <a
              href="privacy.html"
              target="_blank"
              rel="noopener">

              회원정보 수집·이용 안내

            </a>

            를 확인했으며 계정 및 정회원 승인
            목적으로 정보를 저장·이용하는 데
            동의합니다.

          </span>

        </label>


        <!-- 가입 완료 버튼 -->

        <button
          class="auth-submit"
          type="submit"
          id="finish-submit">

          SANNA 회원가입 완료

        </button>


        <!-- 가입 취소 -->

        <button
          type="button"
          class="secondary-btn"
          id="cancel-onboarding">

          가입 취소 및 로그아웃

        </button>

      </form>


      <!-- ======================================
           3. 비밀번호 재설정 화면
           ====================================== -->

      <form id="new-password" class="hidden">

        <p class="signup-note">
          새 비밀번호를 등록해 주세요.
        </p>


        <div class="field">

          <label for="replacement-password">
            새 비밀번호
          </label>

          <input
            type="password"
            id="replacement-password"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="새 비밀번호를 입력하세요"
          />

        </div>


        <button
          class="auth-submit"
          type="submit">

          비밀번호 변경

        </button>

      </form>


      <!-- ======================================
           4. 처리 결과 메시지
           ====================================== -->

      <div
        class="feedback"
        role="status"
        aria-live="polite"
        id="message">
      </div>


      <!-- ======================================
           5. 메인으로 돌아가기
           ====================================== -->

      <div class="back">

        <a href="index.html">
          ← 메인으로 돌아가기
        </a>

      </div>

    </section>

  </main>


  <!-- ==========================================
       Supabase 및 로그인 처리 스크립트
       다음 단계에서 연결
       ========================================== -->

  <script src="./supabase-config.js"></script>

  <script
    type="module"
    src="./login.js">
  </script>

</body>
</html>
