
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANNA | Login & Sign Up</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fcfcfc;
      padding: 20px;
    }

    .auth-box {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-header h2 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .auth-header p {
      font-size: 0.9rem;
      color: #666;
    }

    .social-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .social-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-kakao { background: #FEE500; color: #191919; }
    .btn-naver { background: #03C75A; color: #fff; }
    .btn-google { background: #fff; color: #333; border: 1px solid #ddd; }

    .social-hint {
      text-align: center;
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 20px;
    }

    .divider {
      text-align: center;
      color: #aaa;
      font-size: 0.8rem;
      margin: 20px 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label,
    .member-type-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a1a1a;
    }

    .member-type-selector {
      margin-bottom: 20px;
    }

    .type-options {
      display: flex;
      gap: 10px;
    }

    .type-card {
      flex: 1;
      padding: 13px 10px;
      border: 2px solid #eee;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }

    .type-card:has(input:checked) {
      border-color: #1a1a1a;
      background: #f9f9f9;
    }

    .type-card input { display: none; }
    .type-card .title { font-size: 0.9rem; font-weight: 800; }
    .type-card .desc { font-size: 0.75rem; color: #777; }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover { background: #333; }
    .submit-btn:disabled { opacity: 0.5; cursor: wait; }

    .toggle-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }

    .toggle-auth button {
      background: none;
      border: none;
      color: #1a1a1a;
      text-decoration: underline;
      font-weight: 700;
      cursor: pointer;
      font-size: inherit;
    }

    .feedback {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .feedback.error { display: block; background: #fff2f0; color: #a52222; }
    .feedback.success { display: block; background: #edf8f0; color: #217443; }
    .feedback.info { display: block; background: #f2f4f7; color: #44505f; }

    @media (max-width: 480px) {
      .auth-box { padding: 30px 22px; }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-box">

      <div class="auth-header">
        <h2 id="form-title">SANNA 로그인</h2>
        <p id="form-sub">가입한 계정으로 로그인해 주세요.</p>
      </div>

      <!-- 간편 로그인 -->
      <div class="social-btn-group">
        <button type="button" class="social-btn btn-kakao" onclick="handleSocialAuth('카카오')">
          카카오로 시작하기
        </button>
        <button type="button" class="social-btn btn-naver" onclick="handleSocialAuth('네이버')">
          네이버로 시작하기
        </button>
        <button type="button" class="social-btn btn-google" onclick="handleSocialAuth('Google')">
          Google 계정으로 로그인
        </button>
      </div>

      <p class="social-hint">간편로그인은 실제 계정 연동 후 이용 가능합니다.</p>

      <div class="divider">또는 일반 계정</div>

      <form id="auth-form">

        <!-- 회원가입 시에만 표시 -->
        <div id="signup-fields" style="display:none;">

          <div class="member-type-selector">
            <span class="member-type-label">가입 유형 선택</span>
            <div class="type-options">

              <label class="type-card">
                <input type="radio" name="member_type" value="guest">
                <div class="title">일반 회원</div>
                <div class="desc">공개 페이지 이용</div>
              </label>

              <label class="type-card">
                <input type="radio" name="member_type" value="sanna" checked>
                <div class="title">산나 정회원</div>
                <div class="desc">정기 공지 접근 (_sanna)</div>
              </label>

            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="username">아이디</label>
          <input type="text" id="username"
                 placeholder="영문·숫자·밑줄(_) 3~24자"
                 autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password"
                 placeholder="비밀번호를 입력하세요"
                 autocomplete="current-password" required>
        </div>

        <div class="form-group" id="confirm-group" style="display:none;">
          <label for="confirm-password">비밀번호 확인</label>
          <input type="password" id="confirm-password"
                 placeholder="비밀번호를 다시 입력하세요"
                 autocomplete="new-password">
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          로그인
        </button>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </form>

      <div class="toggle-auth">
        <span id="toggle-text">계정이 없으신가요?</span>
        <button type="button" id="toggle-btn" onclick="toggleMode()">
          회원가입하기
        </button>
      </div>

      <div style="text-align:center; margin-top:20px;">
        <a href="index.html" style="font-size:0.8rem; color:#888;">
          ← 메인으로 돌아가기
        </a>
      </div>

    </div>
  </div>

  <script>
    // 브라우저에 데이터를 저장하는 테스트용 인증
    // 실제 서비스에서는 서버 인증으로 교체해야 합니다.
    const USERS_KEY = 'sanna_users_v2';
    const SESSION_KEY = 'sanna_current_user';

    let isSignupMode = false;

    function $(id) {
      return document.getElementById(id);
    }

    function showMessage(message, type = 'error') {
      $('feedback').textContent = message;
      $('feedback').className = 'feedback ' + type;
    }

    function clearMessage() {
      $('feedback').textContent = '';
      $('feedback').className = 'feedback';
    }

    // 로그인 / 회원가입 화면 전환
    function setMode(signup) {
      isSignupMode = signup;

      $('form-title').textContent = signup ? 'SANNA 회원가입' : 'SANNA 로그인';
      $('form-sub').textContent = signup
        ? '회원가입 완료 후 다시 로그인해 주세요.'
        : '가입한 계정으로 로그인해 주세요.';

      $('signup-fields').style.display = signup ? 'block' : 'none';
      $('confirm-group').style.display = signup ? 'block' : 'none';
      $('confirm-password').required = signup;

      $('submit-btn').textContent = signup ? '회원가입 완료' : '로그인';
      $('toggle-text').textContent = signup
        ? '이미 계정이 있으신가요?'
        : '계정이 없으신가요?';
      $('toggle-btn').textContent = signup ? '로그인하기' : '회원가입하기';

      $('password').value = '';
      $('confirm-password').value = '';
      $('password').autocomplete = signup ? 'new-password' : 'current-password';

      clearMessage();
    }

    function toggleMode() {
      setMode(!isSignupMode);
    }

    // 저장된 회원 데이터 불러오기
    function getUsers() {
      try {
        const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
        return users && typeof users === 'object' && !Array.isArray(users)
          ? users
          : {};
      } catch {
        return {};
      }
    }

    // 비밀번호 해시 처리 (테스트용 로컬 저장)
    function bytesToBase64(bytes) {
      return btoa(String.fromCharCode(...new Uint8Array(bytes)));
    }

    function base64ToBytes(value) {
      return Uint8Array.from(atob(value), c => c.charCodeAt(0));
    }

    async function hashPassword(password, salt) {
      if (!window.crypto || !crypto.subtle) {
        throw new Error('HTTPS 환경에서 사이트에 접속해 주세요.');
      }

      const encoder = new TextEncoder();
      const key = await crypto.subtle.importKey(
        'raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']
      );

      const bits = await crypto.subtle.deriveBits({
        name: 'PBKDF2',
        salt: base64ToBytes(salt),
        iterations: 150000,
        hash: 'SHA-256'
      }, key, 256);

      return bytesToBase64(bits);
    }

    // 회원가입
    async function registerUser(username, password) {
      const type = document.querySelector(
        'input[name="member_type"]:checked'
      ).value;

      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        throw new Error('아이디는 영문, 숫자, 밑줄(_) 3~24자로 입력해 주세요.');
      }

      if (password.length < 8) {
        throw new Error('비밀번호는 8자 이상이어야 합니다.');
      }

      if (password !== $('confirm-password').value) {
        throw new Error('비밀번호 확인이 일치하지 않습니다.');
      }

      if (type === 'guest' && username.toLowerCase().endsWith('_sanna')) {
        throw new Error('일반 회원은 _sanna 아이디를 사용할 수 없습니다.');
      }

      let finalUsername = username;

      if (type === 'sanna' && !username.toLowerCase().endsWith('_sanna')) {
        finalUsername += '_sanna';
      }

      const users = getUsers();
      const key = finalUsername.toLowerCase();

      if (Object.prototype.hasOwnProperty.call(users, key)) {
        throw new Error('이미 등록된 아이디입니다.');
      }

      if (!window.crypto || !crypto.subtle) {
        throw new Error('HTTPS 환경에서 사이트에 접속해 주세요.');
      }

      const salt = bytesToBase64(crypto.getRandomValues(new Uint8Array(16)));
      const passwordHash = await hashPassword(password, salt);

      users[key] = {
        username: finalUsername,
        isSanna: type === 'sanna',
        salt: salt,
        passwordHash: passwordHash
      };

      localStorage.setItem(USERS_KEY, JSON.stringify(users));

      // 회원가입과 로그인 분리: 여기서 로그인하지 않음
      localStorage.removeItem(SESSION_KEY);

      setMode(false);
      $('username').value = finalUsername;

      showMessage(
        '회원가입이 완료되었습니다. 아이디와 비밀번호로 로그인해 주세요.',
        'success'
      );
    }

    // 일반 로그인
    async function loginUser(username, password) {
      const users = getUsers();
      const user = users[username.toLowerCase()];

      if (!user || !user.salt || !user.passwordHash) {
        throw new Error('등록된 계정이 없습니다. 먼저 회원가입해 주세요.');
      }

      const hash = await hashPassword(password, user.salt);

      if (hash !== user.passwordHash) {
        throw new Error('비밀번호가 올바르지 않습니다.');
      }

      // 비밀번호 검증 후에만 로그인
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        username: user.username,
        isSanna: user.isSanna === true,
        authVersion: 2,
        loggedInAt: new Date().toISOString()
      }));

      window.location.href = 'index.html';
    }

    // 폼 제출
    $('auth-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      clearMessage();

      const username = $('username').value.trim();
      const password = $('password').value;
      const submitBtn = $('submit-btn');

      submitBtn.disabled = true;

      try {
        if (isSignupMode) {
          await registerUser(username, password);
        } else {
          await loginUser(username, password);
        }
      } catch (error) {
        showMessage(error.message || '처리 중 오류가 발생했습니다.');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 실제 OAuth 미연동 상태에서 가짜 로그인 방지
    function handleSocialAuth(provider) {
      showMessage(
        provider + ' 계정 인증은 아직 연결되지 않았습니다. ' +
        '현재는 일반 계정으로 회원가입한 후 로그인해 주세요.',
        'info'
      );
    }

    // 기존 가짜 로그인 세션 정리
    (function clearOldSession() {
      try {
        const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (session && session.authVersion !== 2) {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch {
        localStorage.removeItem(SESSION_KEY);
      }
    })();
  </script>
</body>
</html>
