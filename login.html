<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANNA | Login & Sign Up</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcfcfc;
            padding: 20px;
        }
        .auth-box {
            background: #ffffff;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: #666;
            font-size: 0.9rem;
        }

        /* 소셜 버튼 스타일 */
        .social-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .social-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            border: none;
            transition: 0.2s;
        }
        .btn-kakao { background-color: #FEE500; color: #191919; }
        .btn-naver { background-color: #03C75A; color: #ffffff; }
        .btn-google { background-color: #ffffff; color: #333; border: 1px solid #ddd; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }
        .divider span { padding: 0 10px; }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #333;
        }
        .form-group input[type="text"], .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        /* 회원 유형 선택 직관적 카드 */
        .member-type-selector {
            margin-bottom: 20px;
        }
        .member-type-label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }
        .type-options {
            display: flex;
            gap: 10px;
        }
        .type-card {
            flex: 1;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .type-card input { display: none; }
        .type-card .title { font-weight: 800; font-size: 0.9rem; margin-bottom: 4px; }
        .type-card .desc { font-size: 0.75rem; color: #777; }
        
        /* 선택된 카드 스타일 */
        .type-card.active {
            border-color: #1a1a1a;
            background-color: #f9f9f9;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover { background: #333; }
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
        }
        .toggle-auth a {
            color: #1a1a1a;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2 id="form-title">SANNA 로그인</h2>
                <p id="form-sub">기록으로 시작하는 소중한 아카이브 커뮤니티</p>
            </div>

            <!-- 소셜 간편 로그인 -->
            <div class="social-btn-group">
                <button class="social-btn btn-kakao" onclick="handleSocialAuth('카카오')">카카오로 시작하기</button>
                <button class="social-btn btn-naver" onclick="handleSocialAuth('네이버')">네이버로 시작하기</button>
                <button class="social-btn btn-google" onclick="handleSocialAuth('Google')">Google 계정으로 로그인</button>
            </div>

            <div class="divider"><span>또는 일반 계정</span></div>

            <form id="auth-form" onsubmit="handleSubmit(event)">
                <!-- 회원가입 전용 명확한 회원 유형 선택 영역 -->
                <div id="signup-options" style="display: none;" class="member-type-selector">
                    <span class="member-type-label">가입 유형 선택</span>
                    <div class="type-options">
                        <label class="type-card" id="card-guest" onclick="selectType('guest')">
                            <input type="radio" name="member_type" value="guest">
                            <div class="title">일반 회원</div>
                            <div class="desc">공개 페이지 이용</div>
                        </label>

                        <label class="type-card active" id="card-sanna" onclick="selectType('sanna')">
                            <input type="radio" name="member_type" value="sanna" checked>
                            <div class="title">산나 정회원</div>
                            <div class="desc">아카이브 및 공지 접근 (_sanna)</div>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="username" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn-text">로그인</button>
            </form>

            <div class="toggle-auth">
                <span id="toggle-text">계정이 없으신가요?</span>
                <a onclick="toggleAuthMode()" id="toggle-link">회원가입하기</a>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="font-size: 0.8rem; color: #888;">← 메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script>
        let isSignUpMode = false;
        let selectedMemberType = 'sanna';

        function selectType(type) {
            selectedMemberType = type;
            document.getElementById('card-guest').classList.remove('active');
            document.getElementById('card-sanna').classList.remove('active');

            if (type === 'sanna') {
                document.getElementById('card-sanna').classList.add('active');
            } else {
                document.getElementById('card-guest').classList.add('active');
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('form-title');
            const sub = document.getElementById('form-sub');
            const signupOptions = document.getElementById('signup-options');
            const submitBtn = document.getElementById('submit-btn-text');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');

            if (isSignUpMode) {
                title.innerText = "SANNA 회원가입";
                sub.innerText = "가입 유형을 선택하고 정보를 입력해 주세요.";
                signupOptions.style.display = "block";
                submitBtn.innerText = "회원가입 완료";
                toggleText.innerText = "이미 계정이 있으신가요?";
                toggleLink.innerText = "로그인하기";
            } else {
                title.innerText = "SANNA 로그인";
                sub.innerText = "기록으로 시작하는 소중한 아카이브 커뮤니티";
                signupOptions.style.display = "none";
                submitBtn.innerText = "로그인";
                toggleText.innerText = "계정이 없으신가요?";
                toggleLink.innerText = "회원가입하기";
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            let rawUsername = document.getElementById('username').value.trim();
            if (!rawUsername) return;

            let finalUsername = rawUsername;

            if (isSignUpMode) {
                if (selectedMemberType === 'sanna' && !rawUsername.endsWith('_sanna')) {
                    finalUsername = rawUsername + '_sanna';
                }

                const userData = {
                    username: finalUsername,
                    isSanna: finalUsername.endsWith('_sanna')
                };
                localStorage.setItem('sanna_user_' + finalUsername, JSON.stringify(userData));
                localStorage.setItem('sanna_current_user', JSON.stringify(userData));

                alert(`회원가입이 완료되었습니다!\n생성된 아이디: ${finalUsername}`);
            } else {
                const isSanna = finalUsername.endsWith('_sanna');
                const userData = {
                    username: finalUsername,
                    isSanna: isSanna
                };
                localStorage.setItem('sanna_current_user', JSON.stringify(userData));
                alert(`${finalUsername}님, 환영합니다!`);
            }

            window.location.href = 'index.html';
        }

        function handleSocialAuth(provider) {
            const isSanna = confirm(`[${provider} 연동 회원가입]\n\n산나 정회원으로 가입하시겠습니까?\n\n- '확인': 정회원 전용 권한 부여 (_sanna)\n- '취소': 일반 회원 권한 부여`);

            const prefix = provider === '카카오' ? 'kakao' : provider === '네이버' ? 'naver' : 'google';
            const username = isSanna ? `${prefix}_user_sanna` : `${prefix}_user`;

            const userData = {
                username: username,
                isSanna: isSanna
            };

            localStorage.setItem('sanna_current_user', JSON.stringify(userData));
            alert(`${provider} 연동 가입이 완료되었습니다.\n(아이디: ${username})`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
