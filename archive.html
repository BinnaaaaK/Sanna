
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANNA | Archive</title>

  <!-- 기존 SANNA 공통 디자인 -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

  <style>
    /* ==========================================
       1. 전체 레이아웃
       ========================================== */

    .archive-wrapper {
      display: flex;
      min-height: 100vh;
      background: #fff;
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      padding: 60px 40px;
      border-right: 1px solid #eee;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar h2 {
      color: #888;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .year-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 25px;
    }

    .year-item {
      display: block;
      padding: 0;
      border: none;
      background: transparent;
      color: #ccc;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: color .2s, transform .2s;
    }

    .year-item:hover,
    .year-item.active {
      color: #1a1a1a;
      transform: translateX(8px);
    }

    .main-content {
      flex: 1;
      min-width: 0;
      max-width: 1200px;
      padding: 70px 7%;
    }

    .archive-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 22px;
      margin-bottom: 45px;
    }

    .back-home {
      color: #888;
      font-size: .85rem;
      font-weight: 700;
    }

    .back-home:hover {
      color: #1a1a1a;
    }


    /* ==========================================
       2. 안내 메시지 및 접근 제어
       ========================================== */

    .status {
      background: #f5f5f5;
      border: 1px solid #ececec;
      border-radius: 9px;
      padding: 16px 18px;
      margin-bottom: 25px;
      color: #555;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }


    /* ==========================================
       3. 연도 및 월별 목록
       ========================================== */

    .year-display {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.2;
      margin-bottom: 45px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .month-btn {
      width: 100%;
      aspect-ratio: 1.2 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition:
        background .2s,
        color .2s,
        border-color .2s;
    }

    .month-btn:hover,
    .month-btn:focus-visible {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }


    /* ==========================================
       4. 공지 상세 보기
       ========================================== */

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .action-btn {
      padding: 11px 18px;
      border: none;
      border-radius: 6px;
      background: #f3f3f3;
      color: #1a1a1a;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }

    .action-btn:hover {
      background: #e5e5e5;
    }

    .action-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .edit-btn {
      background: #1a1a1a;
      color: #fff;
    }

    .edit-btn:hover {
      background: #333;
    }

    .save-btn {
      background: #006adb;
      color: #fff;
    }

    .save-btn:hover {
      background: #0057b8;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding-bottom: 20px;
      margin-bottom: 35px;
      border-bottom: 2px solid #1a1a1a;
    }

    .detail-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.35;
    }

    .detail-body {
      min-height: 120px;
      margin-bottom: 40px;
      color: #444;
      font-size: 1.05rem;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }


    /* ==========================================
       5. 관리자 공지 수정 화면
       ========================================== */

    .edit-label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .edit-textarea {
      display: block;
      width: 100%;
      min-height: 250px;
      height: 300px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.7;
      resize: vertical;
    }

    .edit-textarea:focus {
      outline: 2px solid #1a1a1a;
      outline-offset: 1px;
    }

    .edit-help {
      margin: -5px 0 18px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    .archive-footer {
      margin-top: 65px;
      padding-top: 25px;
      border-top: 1px solid #eee;
      color: #aaa;
      font-size: 12px;
    }


    /* ==========================================
       6. 태블릿 및 모바일
       ========================================== */

    @media (max-width: 768px) {

      .archive-wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        overflow: visible;
        padding: 25px 24px;
        border-right: none;
        border-bottom: 1px solid #eee;
      }

      .sidebar h2 {
        margin-bottom: 14px;
      }

      .year-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 20px;
      }

      .year-item {
        font-size: 1.4rem;
      }

      .main-content {
        padding: 35px 24px;
      }

      .year-display {
        font-size: 3rem;
        margin-bottom: 30px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-title {
        font-size: 1.7rem;
      }

      .detail-body {
        font-size: 1rem;
      }

    }

    @media (max-width: 380px) {

      .main-content {
        padding: 30px 18px;
      }

      .sidebar {
        padding: 22px 18px;
      }

      .grid {
        gap: 10px;
      }

      .month-btn {
        font-size: 1rem;
      }

      .action-btn {
        padding: 10px 12px;
        font-size: .8rem;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      .year-item,
      .month-btn,
      .action-btn {
        transition: none;
      }

    }
  </style>
</head>

<body>

  <div class="archive-wrapper">


    <!-- ======================================
         1. 연도 선택 사이드바
         ====================================== -->

    <aside
      class="sidebar"
      aria-label="아카이브 연도 선택">

      <h2>YEARS</h2>

      <!-- archive.js에서 연도 버튼 생성 -->
      <div
        class="year-list"
        id="year-list">
      </div>

    </aside>


    <!-- ======================================
         2. 메인 콘텐츠
         ====================================== -->

    <main class="main-content">

      <!-- 상단 이동 메뉴 -->

      <nav
        class="archive-nav"
        aria-label="아카이브 이동 메뉴">

        <a
          href="index.html"
          class="back-home">
          ← BACK TO HOME
        </a>

        <a
          href="account.html"
          class="back-home">
          MY ACCOUNT
        </a>

      </nav>


      <!-- ====================================
           3. 인증 및 권한 확인 메시지
           ==================================== -->

      <p
        class="status"
        id="status"
        role="status"
        aria-live="polite">

        로그인 및 정회원 접근 권한을 확인하고 있습니다.

      </p>


      <!-- ====================================
           4. 정회원 전용 콘텐츠
           권한 확인 전에는 숨김
           ==================================== -->

      <div
        id="protected"
        class="hidden">


        <!-- ==================================
             4-1. 월별 공지 목록
             ================================== -->

        <section
          id="month-grid-view"
          aria-labelledby="selected-year">

          <h1
            class="year-display"
            id="selected-year">
            2026
          </h1>

          <!-- 월별 버튼 12개는 JS에서 생성 -->
          <div
            class="grid"
            id="month-grid"
            aria-label="월별 공지 목록">
          </div>

        </section>


        <!-- ==================================
             4-2. 공지 상세 보기
             ================================== -->

        <section
          id="detail-view"
          class="hidden"
          aria-labelledby="content-title">


          <!-- 목록 이동 및 수정 버튼 -->

          <div class="btn-group">

            <button
              type="button"
              class="action-btn"
              id="back-list">

              ← 목록으로 돌아가기

            </button>


            <!-- 관리자에게만 표시 -->

            <button
              type="button"
              class="action-btn edit-btn hidden"
              id="toggle-edit">

              ✏️ 수정하기

            </button>

          </div>


          <!-- 공지 제목 -->

          <div class="detail-header">

            <h1
              class="detail-title"
              id="content-title">
            </h1>

          </div>


          <!-- ==================================
               4-3. 공지 읽기 모드
               ================================== -->

          <div
            class="detail-body"
            id="content-body">
          </div>


          <!-- ==================================
               4-4. 관리자 수정 모드
               ================================== -->

          <div
            id="edit-area"
            class="hidden">


            <label
              for="edit-input"
              class="edit-label">

              공지 내용 작성·수정

            </label>


            <textarea
              class="edit-textarea"
              id="edit-input"
              maxlength="30000"
              placeholder="월별 공지 내용을 입력하세요.">
            </textarea>


            <p class="edit-help">

              저장한 내용은 승인된 정회원에게
              동일하게 표시됩니다.

            </p>


            <!-- 수정 버튼 -->

            <div class="btn-group">

              <button
                type="button"
                class="action-btn save-btn"
                id="save-notice">

                저장하기

              </button>


              <button
                type="button"
                class="action-btn"
                id="cancel-edit">

                취소

              </button>

            </div>

          </div>

        </section>

      </div>


      <!-- ====================================
           5. 푸터
           ==================================== -->

      <footer class="archive-footer">

        © 2026 SANNA. All rights reserved.

      </footer>

    </main>

  </div>


  <!-- ==========================================
       6. Supabase 설정
       ========================================== -->

  <script src="./supabase-config.js"></script>


  <!-- ==========================================
       7. 아카이브 처리
       다음 단계에서 등록
       ========================================== -->

  <script
    type="module"
    src="./archive.js">
  </script>

</body>
</html>
