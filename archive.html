<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANNA | Archive</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        .archive-wrapper { display: flex; min-height: 100vh; background: #fff; }
        
        /* 사이드바 스타일 */
        .sidebar {
            width: 280px; border-right: 1px solid #eee; padding: 60px 40px;
            position: sticky; top: 0; height: 100vh;
        }
        .sidebar h2 { font-size: 1rem; color: #888; margin-bottom: 30px; letter-spacing: 2px; }
        .year-list { list-style: none; }
        .year-item { margin-bottom: 25px; cursor: pointer; color: #ccc; font-size: 1.8rem; font-weight: 800; transition: 0.3s; }
        .year-item:hover, .year-item.active { color: #1a1a1a; transform: translateX(10px); }

        /* 메인 콘텐츠 스타일 */
        .main-content { flex: 1; padding: 80px 8%; max-width: 1000px; }
        .back-home { text-decoration: none; color: #888; font-size: 0.85rem; font-weight: 600; margin-bottom: 40px; display: inline-block; }
        
        #month-grid-view { display: block; }
        .year-display { font-size: 4rem; font-weight: 900; margin-bottom: 50px; letter-spacing: -2px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .month-btn {
            aspect-ratio: 1.2 / 1; border: 1px solid #eee; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; border-radius: 8px;
        }
        .month-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

        /* 상세 내용 뷰 스타일 */
        #detail-view { display: none; }
        .detail-header { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; border-bottom: 2px solid #1a1a1a; padding-bottom: 20px; 
        }
        .detail-title { font-size: 2.5rem; font-weight: 900; }
        .detail-body { font-size: 1.1rem; line-height: 1.8; color: #444; white-space: pre-wrap; margin-bottom: 40px; }
        
        /* 버튼 공통 스타일 */
        .btn-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .action-btn { 
            background: #f5f5f5; padding: 10px 20px; border: none; font-weight: 700; 
            cursor: pointer; border-radius: 6px; transition: 0.2s; font-size: 0.9rem;
        }
        .action-btn:hover { background: #e5e5e5; }
        .edit-btn { background: #1a1a1a; color: #fff; }
        .edit-btn:hover { background: #333; }
        .save-btn { background: #007bff; color: #fff; }
        .save-btn:hover { background: #0056b3; }

        /* 수정 입력 창 스타일 */
        #edit-area { display: none; margin-top: 20px; }
        .edit-textarea {
            width: 100%; height: 250px; padding: 15px; font-size: 1rem; line-height: 1.6;
            border: 1px solid #ccc; border-radius: 8px; font-family: inherit; resize: vertical;
            margin-bottom: 15px; box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .archive-wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 30px; border-right: none; border-bottom: 1px solid #eee; }
            .year-list { display: flex; gap: 20px; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            .detail-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="archive-wrapper">
        <aside class="sidebar">
            <h2>YEARS</h2>
            <ul class="year-list">
                <li class="year-item active" onclick="changeYear('2026')">2026</li>
                <li class="year-item" onclick="changeYear('2025')">2025</li>
                <li class="year-item" onclick="changeYear('2024')">2024</li>
            </ul>
        </aside>

        <main class="main-content">
            <a href="index.html" class="back-home">← BACK TO HOME</a>
            
            <!-- 월별 그리드 뷰 -->
            <div id="month-grid-view">
                <h1 class="year-display" id="selected-year">2026</h1>
                <div class="grid" id="month-grid"></div>
            </div>

            <!-- 공지 상세 및 수정 뷰 -->
            <div id="detail-view">
                <div class="btn-group">
                    <button class="action-btn" onclick="closeDetail()">← 목록으로 돌아가기</button>
                    <button class="action-btn edit-btn" id="toggle-edit-btn" onclick="toggleEdit()">✏️ 수정하기</button>
                </div>

                <div class="detail-header">
                    <h1 class="detail-title" id="content-title"></h1>
                </div>

                <!-- 읽기 모드 -->
                <div class="detail-body" id="content-body"></div>

                <!-- 수정 모드 -->
                <div id="edit-area">
                    <textarea class="edit-textarea" id="edit-input" placeholder="공지 내용을 입력하세요..."></textarea>
                    <div class="btn-group">
                        <button class="action-btn save-btn" onclick="saveNotice()">저장하기</button>
                        <button class="action-btn" onclick="cancelEdit()">취소</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 기본 초기 데이터
        const defaultArchiveData = {
            "2026": { 
                "1": "2026년 1월 정기 공지입니다.\n새로운 시즌이 시작되었습니다.", 
                "2": "2월은 기록의 달입니다. 다양한 활동을 준비했습니다." 
            },
            "2025": { 
                "1": "2025년 1월 아카이브입니다.",
                "12": "2025년의 마지막 정기 공지입니다." 
            },
            "2024": { 
                "5": "산나 커뮤니티의 시작! 첫 번째 공지사항입니다." 
            }
        };

        // localStorage에서 데이터를 불러오고, 없으면 기본값 저장
        let archiveData = JSON.parse(localStorage.getItem('sanna_archive_data')) || defaultArchiveData;

        let currentYear = "2026";
        let currentMonth = null;

        function saveToLocalStorage() {
            localStorage.setItem('sanna_archive_data', JSON.stringify(archiveData));
        }

        function changeYear(year) {
            currentYear = year;
            document.getElementById('selected-year').innerText = year;
            document.querySelectorAll('.year-item').forEach(item => {
                item.classList.remove('active');
                if(item.innerText === year) item.classList.add('active');
            });
            renderGrid();
            closeDetail();
        }

        function renderGrid() {
            const grid = document.getElementById('month-grid');
            grid.innerHTML = "";
            for (let i = 1; i <= 12; i++) {
                const btn = document.createElement('div');
                btn.className = 'month-btn';
                btn.innerText = i < 10 ? `0${i}월` : `${i}월`;
                btn.onclick = () => showDetail(i);
                grid.appendChild(btn);
            }
        }

        function showDetail(month) {
            currentMonth = month;
            const bodyText = archiveData[currentYear]?.[month] || "아직 작성된 공지가 없습니다.";
            
            document.getElementById('content-title').innerText = `${currentYear}년 ${month}월 정기 공지`;
            document.getElementById('content-body').innerText = bodyText;
            
            // 수정 상태 초기화
            cancelEdit();

            document.getElementById('month-grid-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function closeDetail() {
            document.getElementById('month-grid-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
        }

        // 수정 기능 함수들
        function toggleEdit() {
            const currentBody = archiveData[currentYear]?.[currentMonth] || "";
            document.getElementById('edit-input').value = currentBody;
            document.getElementById('content-body').style.display = 'none';
            document.getElementById('edit-area').style.display = 'block';
            document.getElementById('toggle-edit-btn').style.display = 'none';
        }

        function cancelEdit() {
            document.getElementById('content-body').style.display = 'block';
            document.getElementById('edit-area').style.display = 'none';
            document.getElementById('toggle-edit-btn').style.display = 'inline-block';
        }

        function saveNotice() {
            const updatedText = document.getElementById('edit-input').value;

            if (!archiveData[currentYear]) {
                archiveData[currentYear] = {};
            }

            // 데이터 업데이트 및 저장
            archiveData[currentYear][currentMonth] = updatedText;
            saveToLocalStorage();

            // 화면 갱신
            document.getElementById('content-body').innerText = updatedText || "아직 작성된 공지가 없습니다.";
            cancelEdit();
            alert('성공적으로 저장되었습니다!');
        }

        renderGrid(); // 초기 그리드 생성
    </script>
</body>
</html>
